<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="728" viewBox="0 0 1100 728" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Turn end: Claude finishes, Readback speaks two sentences; any prompt stops it">
