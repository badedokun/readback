<marker id="arrA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2f6feb"/></marker>
</defs>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="24" y="36" font-size="18" font-weight="600" fill="#1f2328">Turn end: Claude finishes, Readback speaks two sentences; any prompt stops it</text>
<path d="M120 106V684" stroke="#d0d7de" stroke-width="1.25" stroke-dasharray="4 4"/><rect x="40" y="60" width="160" height="46" rx="8" fill="#ffffff" stroke="#8c959f" stroke-width="1.25"/><text x="120" y="84" font-size="14" font-weight="600" fill="#1f2328" text-anchor="middle">Developer</text><path d="M335 106V684" stroke="#d0d7de" stroke-width="1.25" stroke-dasharray="4 4"/><rect x="255" y="60" width="160" height="46" rx="8" fill="#ffffff" stroke="#8c959f" stroke-width="1.25"/><text x="335" y="84" font-size="14" font-weight="600" fill="#1f2328" text-anchor="middle">Claude Code</text><path d="M550 106V684" stroke="#d0d7de" stroke-width="1.25" stroke-dasharray="4 4"/><rect x="470" y="60" width="160" height="46" rx="8" fill="#ffffff" stroke="#8c959f" stroke-width="1.25"/><text x="550" y="84" font-size="14" font-weight="600" fill="#1f2328" text-anchor="middle">Hook shims</text><path d="M765 106V684" stroke="#d0d7de" stroke-width="1.25" stroke-dasharray="4 4"/><rect x="685" y="60" width="160" height="46" rx="8" fill="#eaf2ff" stroke="#2f6feb" stroke-width="2"/><text x="765" y="84" font-size="14" font-weight="600" fill="#1f2328" text-anchor="middle">Readback daemon</text><path d="M980 106V684" stroke="#d0d7de" stroke-width="1.25" stroke-dasharray="4 4"/><rect x="900" y="60" width="160" height="46" rx="8" fill="#ffffff" stroke="#8c959f" stroke-width="1.25"/><text x="980" y="84" font-size="14" font-weight="600" fill="#1f2328" text-anchor="middle">Speakers</text><rect x="24" y="422" width="1052" height="224" rx="4" fill="none" stroke="#d0d7de" stroke-width="1.25"/><path d="M24 444H70L80 434V422" fill="#f6f8fa" stroke="#d0d7de"/><path d="M120 140H333" fill="none" stroke="#8c959f" stroke-width="1.4" marker-end="url(#arr)"/><text x="227.5" y="133" font-size="12" fill="#1f2328" text-anchor="middle" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">1. prompt (dictated with /voice)</text><rect x="194.3" y="160" width="281.4" height="26" rx="6" fill="#fff8e5" stroke="#9a6700" stroke-width="1"/><text x="335" y="178" font-size="12" fill="#1f2328" text-anchor="middle">works: tools run, Readback stays silent</text><path d="M335 216H548" fill="none" stroke="#8c959f" stroke-width="1.4" marker-end="url(#arr)"/><text x="442.5" y="209" font-size="12" fill="#1f2328" text-anchor="middle" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">2. Stop {last_assistant_message}</text><path d="M550 254H763" fill="none" stroke="#8c959f" stroke-width="1.4" marker-end="url(#arr)"/><text x="657.5" y="247" font-size="12" fill="#1f2328" text-anchor="middle" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">3. speak.turn(message, elapsed)</text><path d="M550 292H337" fill="none" stroke="#8c959f" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#arr)"/><text x="442.5" y="285" font-size="12" fill="#1f2328" text-anchor="middle" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">4. exit 0 (&lt; 50 ms)</text><rect x="650.7" y="312" width="228.6" height="26" rx="6" fill="#fff8e5" stroke="#9a6700" stroke-width="1"/><text x="765" y="330" font-size="12" fill="#1f2328" text-anchor="middle">summarize with the speech rules</text><path d="M765 368H978" fill="none" stroke="#8c959f" stroke-width="1.4" marker-end="url(#arr)"/><text x="872.5" y="361" font-size="12" fill="#1f2328" text-anchor="middle" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">5. play summary</text><path d="M980 406H122" fill="none" stroke="#8c959f" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#arr)"/><text x="550" y="399" font-size="12" fill="#1f2328" text-anchor="middle" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">6. hears ≤ 2 sentences</text><text x="102" y="438" font-size="12" fill="#57606a" text-anchor="start" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">[developer interrupts]</text><path d="M120 470H333" fill="none" stroke="#8c959f" stroke-width="1.4" marker-end="url(#arr)"/><text x="227.5" y="463" font-size="12" fill="#1f2328" text-anchor="middle" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">7. /readback:stop (or any prompt)</text><path d="M335 508H548" fill="none" stroke="#8c959f" stroke-width="1.4" marker-end="url(#arr)"/><text x="442.5" y="501" font-size="12" fill="#1f2328" text-anchor="middle" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">8. UserPromptSubmit</text><path d="M550 546H763" fill="none" stroke="#8c959f" stroke-width="1.4" marker-end="url(#arr)"/><text x="657.5" y="539" font-size="12" fill="#1f2328" text-anchor="middle" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">9. stop()</text><path d="M765 584H978" fill="none" stroke="#8c959f" stroke-width="1.4" marker-end="url(#arr)"/><text x="872.5" y="577" font-size="12" fill="#1f2328" text-anchor="middle" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">10. stop playback (&lt; 150 ms)</text><path d="M550 622H337" fill="none" stroke="#8c959f" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#arr)"/><text x="442.5" y="615" font-size="12" fill="#1f2328" text-anchor="middle" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">11. block: not sent to Claude</text><text x="32" y="438" font-size="12" font-weight="600" fill="#1f2328">opt</text><text x="24" y="712" font-size="12" fill="#57606a" text-anchor="start" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">Example summary: "Added a rate limiter to the login route. Tests pass. Want me to commit?"  Step 11 applies to /readback:* commands only; normal prompts continue to Claude.</text>
</svg>
