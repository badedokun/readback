<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="710" viewBox="0 0 1040 710" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Readback components: thin hook shims, one local daemon">
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8c959f"/></marker>
<marker id="arrA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2f6feb"/></marker>
</defs>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="24" y="36" font-size="18" font-weight="600" fill="#1f2328">Readback components: thin hook shims, one local daemon</text>
<rect x="24" y="60" width="290" height="520" rx="10" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.25" stroke-dasharray="6 4"/><text x="38" y="82" font-size="13" font-weight="600" fill="#57606a">Hook shims (one short process per event)</text><rect x="344" y="60" width="672" height="520" rx="10" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.25" stroke-dasharray="6 4"/><text x="358" y="82" font-size="13" font-weight="600" fill="#57606a">Readback daemon (one per machine, JSON over Unix socket)</text><path d="M284 130H314" fill="none" stroke="#8c959f" stroke-width="1.4"/><rect x="44" y="100" width="240" height="60" rx="8" fill="#ffffff" stroke="#8c959f" stroke-width="1.25"/><text x="56" y="124" font-size="14" font-weight="600" fill="#1f2328" text-anchor="start">SessionStart</text><text x="56" y="144" font-size="12.5" fill="#57606a" text-anchor="start">start daemon if not running</text><path d="M284 210H314" fill="none" stroke="#8c959f" stroke-width="1.4"/><rect x="44" y="180" width="240" height="60" rx="8" fill="#ffffff" stroke="#8c959f" stroke-width="1.25"/><text x="56" y="204" font-size="14" font-weight="600" fill="#1f2328" text-anchor="start">Stop (async)</text><text x="56" y="224" font-size="12.5" fill="#57606a" text-anchor="start">send last_assistant_message</text><path d="M284 290H314" fill="none" stroke="#8c959f" stroke-width="1.4"/><rect x="44" y="260" width="240" height="60" rx="8" fill="#ffffff" stroke="#8c959f" stroke-width="1.25"/><text x="56" y="284" font-size="14" font-weight="600" fill="#1f2328" text-anchor="start">Notification (async)</text><text x="56" y="304" font-size="12.5" fill="#57606a" text-anchor="start">idle / permission alerts</text><path d="M284 370H314" fill="none" stroke="#8c959f" stroke-width="1.4"/><rect x="44" y="340" width="240" height="60" rx="8" fill="#eaf2ff" stroke="#2f6feb" stroke-width="2"/><text x="56" y="364" font-size="14" font-weight="600" fill="#1f2328" text-anchor="start">PermissionRequest (sync)</text><text x="56" y="384" font-size="12.5" fill="#57606a" text-anchor="start">wait for decision ≤ 30 s</text><path d="M284 450H314" fill="none" stroke="#8c959f" stroke-width="1.4"/><rect x="44" y="420" width="240" height="60" rx="8" fill="#ffffff" stroke="#8c959f" stroke-width="1.25"/><text x="56" y="444" font-size="14" font-weight="600" fill="#1f2328" text-anchor="start">UserPromptSubmit (sync)</text><text x="56" y="464" font-size="12.5" fill="#57606a" text-anchor="start">stop speech; run /readback:*</text><path d="M284 530H314" fill="none" stroke="#8c959f" stroke-width="1.4"/><rect x="44" y="500" width="240" height="60" rx="8" fill="#ffffff" stroke="#8c959f" stroke-width="1.25"/><text x="56" y="524" font-size="14" font-weight="600" fill="#1f2328" text-anchor="start">SessionEnd (async)</text><text x="56" y="544" font-size="12.5" fill="#57606a" text-anchor="start">stop daemon if last session</text><path d="M314 130V530" fill="none" stroke="#8c959f" stroke-width="1.4"/><path d="M314 310H364" fill="none" stroke="#8c959f" stroke-width="1.4" marker-end="url(#arr)"/><path d="M444 265V145H564" fill="none" stroke="#8c959f" stroke-width="1.4" marker-end="url(#arr)"/><path d="M764 145H804" fill="none" stroke="#8c959f" stroke-width="1.4" marker-end="url(#arr)"/><path d="M764 290H784V170H804" fill="none" stroke="#8c959f" stroke-width="1.4" marker-end="url(#arr)"/><path d="M524 310H564" fill="none" stroke="#2f6feb" stroke-width="1.4" marker-end="url(#arrA)" marker-start="url(#arrA)"/><path d="M804 395H784V330H764" fill="none" stroke="#2f6feb" stroke-width="1.4" marker-end="url(#arrA)"/><path d="M900 190V225" fill="none" stroke="#8c959f" stroke-width="1.4" marker-end="url(#arr)"/><path d="M996 265H1006V596H951V612" fill="none" stroke="#8c959f" stroke-width="1.4" marker-end="url(#arr)"/><path d="M849 612V440" fill="none" stroke="#2f6feb" stroke-width="1.4" marker-end="url(#arrA)"/><rect x="364" y="265" width="160" height="90" rx="8" fill="#ffffff" stroke="#8c959f" stroke-width="1.25"/><text x="376" y="289" font-size="14" font-weight="600" fill="#1f2328" text-anchor="start">IPC server</text><text x="376" y="309" font-size="12.5" fill="#57606a" text-anchor="start">Unix socket</text><text x="376" y="326" font-size="12.5" fill="#57606a" text-anchor="start">request / reply</text><rect x="564" y="100" width="200" height="90" rx="8" fill="#ffffff" stroke="#8c959f" stroke-width="1.25"/><text x="576" y="124" font-size="14" font-weight="600" fill="#1f2328" text-anchor="start">Summarizer</text><text x="576" y="144" font-size="12.5" fill="#57606a" text-anchor="start">rules | claude-haiku</text><text x="576" y="161" font-size="12.5" fill="#57606a" text-anchor="start">applies speech rules</text><rect x="564" y="265" width="200" height="90" rx="8" fill="#eaf2ff" stroke="#2f6feb" stroke-width="2"/><text x="576" y="289" font-size="14" font-weight="600" fill="#1f2328" text-anchor="start">Permission broker</text><text x="576" y="309" font-size="12.5" fill="#57606a" text-anchor="start">never_by_voice gate</text><text x="576" y="326" font-size="12.5" fill="#57606a" text-anchor="start">timeout → fallback</text><rect x="564" y="430" width="200" height="76" rx="8" fill="#ffffff" stroke="#8c959f" stroke-width="1.25"/><text x="576" y="454" font-size="14" font-weight="600" fill="#1f2328" text-anchor="start">Config</text><text x="576" y="474" font-size="12.5" fill="#57606a" text-anchor="start">config.toml + project file</text><text x="576" y="491" font-size="12.5" fill="#57606a" text-anchor="start">read by every part</text><rect x="804" y="100" width="192" height="90" rx="8" fill="#ffffff" stroke="#8c959f" stroke-width="1.25"/><text x="816" y="124" font-size="14" font-weight="600" fill="#1f2328" text-anchor="start">Speech queue</text><text x="816" y="144" font-size="12.5" fill="#57606a" text-anchor="start">permission prompts first</text><text x="816" y="161" font-size="12.5" fill="#57606a" text-anchor="start">dedupe 60 s · newest wins</text><rect x="804" y="225" width="192" height="80" rx="8" fill="#ffffff" stroke="#8c959f" stroke-width="1.25"/><text x="816" y="249" font-size="14" font-weight="600" fill="#1f2328" text-anchor="start">TTS adapter</text><text x="816" y="269" font-size="12.5" fill="#57606a" text-anchor="start">say · piper · kokoro</text><text x="816" y="286" font-size="12.5" fill="#57606a" text-anchor="start">espeak · cloud (opt-in)</text><rect x="804" y="350" width="192" height="90" rx="8" fill="#eaf2ff" stroke="#2f6feb" stroke-width="2"/><text x="816" y="374" font-size="14" font-weight="600" fill="#1f2328" text-anchor="start">Answer listener</text><text x="816" y="394" font-size="12.5" fill="#57606a" text-anchor="start">whisper.cpp tiny.en</text><text x="816" y="411" font-size="12.5" fill="#57606a" text-anchor="start">yes / no / show me, 20 s</text><rect x="906" y="612" width="90" height="44" rx="8" fill="#ffffff" stroke="#8c959f" stroke-width="1.25"/><text x="951" y="636" font-size="14" font-weight="600" fill="#1f2328" text-anchor="middle">Speakers</text><rect x="804" y="612" width="90" height="44" rx="8" fill="#ffffff" stroke="#8c959f" stroke-width="1.25"/><text x="849" y="636" font-size="14" font-weight="600" fill="#1f2328" text-anchor="middle">Mic</text><text x="24" y="690" font-size="12" fill="#57606a" text-anchor="start" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">Blue = the voice-approval path. The daemon is the only long-lived process; shims exit immediately except PermissionRequest.</text>
</svg>
