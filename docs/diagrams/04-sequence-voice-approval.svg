<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="890" viewBox="0 0 1100 890" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Voice approval: every failure path falls back to the normal keyboard dialog">
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8c959f"/></marker>
<marker id="arrA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2f6feb"/></marker>
</defs>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="24" y="36" font-size="18" font-weight="600" fill="#1f2328">Voice approval: every failure path falls back to the normal keyboard dialog</text>
<path d="M120 106V846" stroke="#d0d7de" stroke-width="1.25" stroke-dasharray="4 4"/><rect x="40" y="60" width="160" height="46" rx="8" fill="#ffffff" stroke="#8c959f" stroke-width="1.25"/><text x="120" y="84" font-size="14" font-weight="600" fill="#1f2328" text-anchor="middle">Developer</text><path d="M335 106V846" stroke="#d0d7de" stroke-width="1.25" stroke-dasharray="4 4"/><rect x="255" y="60" width="160" height="46" rx="8" fill="#ffffff" stroke="#8c959f" stroke-width="1.25"/><text x="335" y="84" font-size="14" font-weight="600" fill="#1f2328" text-anchor="middle">Claude Code</text><path d="M550 106V846" stroke="#d0d7de" stroke-width="1.25" stroke-dasharray="4 4"/><rect x="470" y="60" width="160" height="46" rx="8" fill="#ffffff" stroke="#8c959f" stroke-width="1.25"/><text x="550" y="84" font-size="14" font-weight="600" fill="#1f2328" text-anchor="middle">Permission hook</text><path d="M765 106V846" stroke="#d0d7de" stroke-width="1.25" stroke-dasharray="4 4"/><rect x="685" y="60" width="160" height="46" rx="8" fill="#eaf2ff" stroke="#2f6feb" stroke-width="2"/><text x="765" y="84" font-size="14" font-weight="600" fill="#1f2328" text-anchor="middle">Readback daemon</text><path d="M980 106V846" stroke="#d0d7de" stroke-width="1.25" stroke-dasharray="4 4"/><rect x="900" y="60" width="160" height="46" rx="8" fill="#ffffff" stroke="#8c959f" stroke-width="1.25"/><text x="980" y="84" font-size="14" font-weight="600" fill="#1f2328" text-anchor="middle">Speaker / mic</text><rect x="24" y="194" width="1052" height="614" rx="4" fill="none" stroke="#d0d7de" stroke-width="1.25"/><path d="M24 216H70L80 206V194" fill="#f6f8fa" stroke="#d0d7de"/><path d="M24 334H1076" stroke="#d0d7de" stroke-dasharray="5 4"/><path d="M24 700H1076" stroke="#d0d7de" stroke-dasharray="5 4"/><path d="M335 140H548" fill="none" stroke="#8c959f" stroke-width="1.4" marker-end="url(#arr)"/><text x="442.5" y="133" font-size="12" fill="#1f2328" text-anchor="middle" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">1. PermissionRequest {tool, input}</text><path d="M550 178H763" fill="none" stroke="#8c959f" stroke-width="1.4" marker-end="url(#arr)"/><text x="657.5" y="171" font-size="12" fill="#1f2328" text-anchor="middle" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">2. permission.ask (hook waits)</text><text x="102" y="210" font-size="12" fill="#57606a" text-anchor="start" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">[matches never_by_voice]</text><path d="M765 242H978" fill="none" stroke="#8c959f" stroke-width="1.4" marker-end="url(#arr)"/><text x="872.5" y="235" font-size="12" fill="#1f2328" text-anchor="middle" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">3. say "needs the keyboard"</text><path d="M765 280H552" fill="none" stroke="#8c959f" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#arr)"/><text x="657.5" y="273" font-size="12" fill="#1f2328" text-anchor="middle" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">4. no decision</text><path d="M550 318H337" fill="none" stroke="#8c959f" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#arr)"/><text x="442.5" y="311" font-size="12" fill="#1f2328" text-anchor="middle" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">5. exit 0, no output → dialog</text><path d="M765 380H978" fill="none" stroke="#8c959f" stroke-width="1.4" marker-end="url(#arr)"/><text x="872.5" y="373" font-size="12" fill="#1f2328" text-anchor="middle" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">6. speak the request</text><rect x="611.1" y="400" width="307.8" height="26" rx="6" fill="#fff8e5" stroke="#9a6700" stroke-width="1"/><text x="765" y="418" font-size="12" fill="#1f2328" text-anchor="middle">e.g. "Claude wants to run npm test. Allow?"</text><path d="M980 456H122" fill="none" stroke="#8c959f" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#arr)"/><text x="550" y="449" font-size="12" fill="#1f2328" text-anchor="middle" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">7. hears the request</text><rect x="594.6" y="476" width="340.79999999999995" height="26" rx="6" fill="#fff8e5" stroke="#9a6700" stroke-width="1"/><text x="765" y="494" font-size="12" fill="#1f2328" text-anchor="middle">listener opens after playback ends (20 s window)</text><path d="M120 532H978" fill="none" stroke="#2f6feb" stroke-width="1.4" marker-end="url(#arrA)"/><text x="550" y="525" font-size="12" fill="#2f6feb" text-anchor="middle" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">8. "allow"</text><path d="M980 570H767" fill="none" stroke="#2f6feb" stroke-width="1.4" marker-end="url(#arrA)"/><text x="872.5" y="563" font-size="12" fill="#2f6feb" text-anchor="middle" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">9. transcript + confidence</text><path d="M765 608H552" fill="none" stroke="#2f6feb" stroke-width="1.4" marker-end="url(#arrA)"/><text x="657.5" y="601" font-size="12" fill="#2f6feb" text-anchor="middle" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">10. allow (this request only)</text><path d="M550 646H337" fill="none" stroke="#2f6feb" stroke-width="1.4" marker-end="url(#arrA)"/><text x="442.5" y="639" font-size="12" fill="#2f6feb" text-anchor="middle" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">11. behavior: "allow"</text><path d="M765 684H978" fill="none" stroke="#8c959f" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#arr)"/><text x="872.5" y="677" font-size="12" fill="#1f2328" text-anchor="middle" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">12. confirmation tone</text><path d="M765 746H552" fill="none" stroke="#8c959f" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#arr)"/><text x="657.5" y="739" font-size="12" fill="#1f2328" text-anchor="middle" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">13. no decision</text><path d="M550 784H337" fill="none" stroke="#8c959f" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#arr)"/><text x="442.5" y="777" font-size="12" fill="#1f2328" text-anchor="middle" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">14. exit 0 → normal dialog</text><text x="32" y="210" font-size="12" font-weight="600" fill="#1f2328">alt</text><text x="102" y="350" font-size="12" fill="#57606a" text-anchor="start" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">[voice-eligible]</text><text x="102" y="716" font-size="12" fill="#57606a" text-anchor="start" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">[timeout, "show me", or low confidence]</text><text x="24" y="874" font-size="12" fill="#57606a" text-anchor="start" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">Voice never grants persistent rules (no updatedPermissions). "deny" returns behavior: "deny" with message "Denied by voice".</text>
</svg>
